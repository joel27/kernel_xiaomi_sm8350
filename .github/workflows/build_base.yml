name: diphons KSU + SuSFS - Mi 11 Ultra (star)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev \
            make libelf-dev python3 \
            zip curl wget cpio \
            clang-19 lld-19 llvm-19

      - name: Setup Clang 19 toolchain
        run: |
          LLVM_BIN=/usr/lib/llvm-19/bin
          mkdir -p clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm \
                      llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x "$LLVM_BIN/$tool" ]; then
              ln -sf "$LLVM_BIN/$tool" clang/bin/$tool
            fi
          done
          clang/bin/clang --version

      - name: Setup GCC toolchain
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Remove old KernelSU
        run: |
          if [ -d drivers/kernelsu ]; then
            rm -rf drivers/kernelsu
          fi
          sed -i '/kernelsu/d' drivers/Kconfig 2>/dev/null || true
          sed -i '/kernelsu/d' drivers/Makefile 2>/dev/null || true
          echo "✅ KernelSU antiguo eliminado"

      - name: Add KernelSU (estándar tiann)
        run: |
          curl -LSs \
            "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" \
            | bash -s main
          echo "✅ KernelSU estándar añadido"

      - name: Apply all 5.4 QGKI fixes
        run: |
          echo "=== FIX 1: pgtable.h ==="
          grep -rl "linux/pgtable.h" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 2: strncpy_from_user_nofault ==="
          grep -rl "strncpy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|strncpy_from_user_nofault|strncpy_from_user|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 3: copy_*_nofault ==="
          grep -rl "copy_to_kernel_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_kernel_nofault|probe_kernel_write|g' "$f"
          done
          grep -rl "copy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_from_user_nofault|probe_kernel_read|g' "$f"
          done
          grep -rl "copy_to_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_user_nofault|probe_kernel_write|g' "$f"
          done

          echo "=== FIX 4: security_inode_init_security_anon ==="
          grep -rl "security_inode_init_security_anon" drivers/kernelsu/ 2>/dev/null | while read f; do
            perl -0pi -e 's/security_inode_init_security_anon\([^;]*\)/0/g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 5: seccomp_cache.c stub ==="
          python3 - << 'PYEOF'
          import os
          sc = "drivers/kernelsu/infra/seccomp_cache.c"
          if os.path.exists(sc):
              with open(sc, "w") as f:
                  f.write(
                      "#include \"seccomp_cache.h\"\n"
                      "void ksu_seccomp_allow_cache(struct seccomp_filter *filter, int nr) {}\n"
                      "void ksu_seccomp_cache_init(void) {}\n"
                  )
              print("  FIXED seccomp_cache.c")
          PYEOF

          echo "=== FIX 6: pkg_observer.c fsnotify ==="
          python3 - << 'PYEOF'
          import re, os
          pkg = "drivers/kernelsu/manager/pkg_observer.c"
          if not os.path.exists(pkg):
              exit(0)
          with open(pkg, "r") as f:
              content = f.read()
          content = content.replace('.handle_inode_event =', '.handle_event =')
          old_fn = re.compile(
              r'static int (ksu_handle_inode_event|ksu_handle_event)\s*\('
              r'\s*struct fsnotify_mark\s*\*\s*\w+\s*,'
              r'\s*u32\s*\w+\s*,'
              r'\s*struct inode\s*\*\s*\w+\s*,'
              r'\s*struct inode\s*\*\s*\w+\s*,'
              r'\s*const struct qstr\s*\*\s*\w+\s*,'
              r'\s*u32\s*\w+\s*\)',
              re.DOTALL
          )
          new_fn = (
              'static int ksu_handle_event('
              'struct fsnotify_group *group, struct inode *inode, '
              'u32 mask, const void *data, int data_type, '
              'const struct qstr *file_name, u32 cookie, '
              'struct fsnotify_iter_info *iter_info)'
          )
          if old_fn.search(content):
              content = old_fn.sub(new_fn, content)
          else:
              content = re.sub(
                  r'static int ksu_handle_inode_event\b',
                  'static int ksu_handle_event', content
              )
          content = content.replace('ksu_handle_inode_event', 'ksu_handle_event')
          with open(pkg, "w") as f:
              f.write(content)
          print("  FIXED pkg_observer.c")
          PYEOF

          echo "=== FIX 7: allowlist.c — TWA_RESUME y put_task_struct ==="
          # CORRECCIÓN: usar python para no tocar directivas del preprocesador
          # El sed anterior rompía #ifndef TWA_RESUME convirtiéndolo en #ifndef 0
          python3 - << 'PYEOF'
          import os, re

          allowlist = "drivers/kernelsu/policy/allowlist.c"
          if not os.path.exists(allowlist):
              print("  allowlist.c no existe, skip")
              exit(0)

          with open(allowlist, "r") as f:
              content = f.read()

          # Fix 1: TWA_RESUME → 0 SOLO en código C (no en directivas #)
          lines = content.split("\n")
          new_lines = []
          for line in lines:
              stripped = line.lstrip()
              if stripped.startswith("#"):
                  new_lines.append(line)
              elif "TWA_RESUME" in line:
                  new_lines.append(line.replace("TWA_RESUME", "0"))
              else:
                  new_lines.append(line)
          content = "\n".join(new_lines)

          # Fix 2: put_task_struct → (void)tsk (no-op válido en C)
          content = re.sub(
              r'\bput_task_struct\s*\(\s*tsk\s*\)\s*;',
              '(void)tsk; /* put_task_struct removed: not available in 5.4 */',
              content
          )

          # Fix 3: Añadir headers necesarios si faltan
          headers_to_add = []
          if "linux/sched/task.h" not in content:
              headers_to_add.append("#include <linux/sched/task.h>")
          if "linux/sched/signal.h" not in content:
              headers_to_add.append("#include <linux/sched/signal.h>")

          if headers_to_add:
              # Insertar después del primer #include existente
              first_include = re.search(r'^#include\s+[<"]', content, re.MULTILINE)
              if first_include:
                  insert_pos = first_include.start()
                  content = content[:insert_pos] + "\n".join(headers_to_add) + "\n" + content[insert_pos:]

          with open(allowlist, "w") as f:
              f.write(content)
          print("  FIXED allowlist.c (TWA_RESUME + put_task_struct + headers)")
          PYEOF

          echo "=== FIX 8: TP hooks Kbuild ==="
          python3 - << 'PYEOF'
          import re, os
          kb = "drivers/kernelsu/Kbuild"
          if os.path.exists(kb):
              with open(kb, "r") as f:
                  content = f.read()
              content = re.sub(
                  r'(ifeq.*TRACEPOINT.*\n(?:.*\n)*?endif)',
                  lambda m: '\n'.join('# ' + l for l in m.group(0).split('\n')),
                  content
              )
              with open(kb, "w") as f:
                  f.write(content)
              print("  FIXED Kbuild TP hooks")
          PYEOF

          echo "=== FIX 9: linux/minmax.h ==="
          python3 - << 'PYEOF'
          import os
          minmax_h = "include/linux/minmax.h"
          if not os.path.exists(minmax_h):
              with open(minmax_h, "w") as f:
                  f.write(
                      "#ifndef _LINUX_MINMAX_H\n"
                      "#define _LINUX_MINMAX_H\n\n"
                      "#include <linux/kernel.h>\n\n"
                      "#endif\n"
                  )
              print("  CREATED include/linux/minmax.h")
          PYEOF

          echo "=== ALL FIXES DONE ==="

      - name: Add Xiaomi missing symbols stubs
        run: |
          python3 - << 'PYEOF'
          import os

          stub_file = "drivers/soc/qcom/xiaomi_hw_stubs.c"
          stub_content = (
              "// Xiaomi hardware stubs\n"
              "#include <linux/kernel.h>\n"
              "#include <linux/export.h>\n\n"
              "int get_hw_version_platform(void) { return 0; }\n"
              "EXPORT_SYMBOL(get_hw_version_platform);\n\n"
              "int get_hw_country_version(void) { return 0; }\n"
              "EXPORT_SYMBOL(get_hw_country_version);\n\n"
              "int get_hw_version_build(void) { return 0; }\n"
              "EXPORT_SYMBOL(get_hw_version_build);\n\n"
              "int get_hw_version_major(void) { return 0; }\n"
              "EXPORT_SYMBOL(get_hw_version_major);\n\n"
              "int get_hw_version_minor(void) { return 0; }\n"
              "EXPORT_SYMBOL(get_hw_version_minor);\n\n"
              "int mi_disp_register_client(void *data) { return 0; }\n"
              "EXPORT_SYMBOL(mi_disp_register_client);\n\n"
              "int mi_disp_unregister_client(void *data) { return 0; }\n"
              "EXPORT_SYMBOL(mi_disp_unregister_client);\n"
          )

          os.makedirs("drivers/soc/qcom", exist_ok=True)
          with open(stub_file, "w") as f:
              f.write(stub_content)
          print(f"  CREATED {stub_file}")

          makefile = "drivers/soc/qcom/Makefile"
          if os.path.exists(makefile):
              with open(makefile, "r") as f:
                  content = f.read()
              if "xiaomi_hw_stubs" not in content:
                  with open(makefile, "a") as f:
                      f.write("\nobj-y += xiaomi_hw_stubs.o\n")
                  print(f"  ADDED to {makefile}")
          PYEOF

      - name: Use functional config as defconfig
        run: |
          if [ ! -f configs/star_defconfig ]; then
            echo "❌ ERROR: configs/star_defconfig no encontrado"
            find . -name "*defconfig*" | head -20
            exit 1
          fi
          mkdir -p arch/arm64/configs
          cp configs/star_defconfig arch/arm64/configs/star_defconfig
          echo "✅ star_defconfig copiado desde configs/"

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          make O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            star_defconfig

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/
          else
            echo "❌ No Image found"
            ls out/arch/arm64/boot/ || true
            exit 1
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          sed -i 's|do.devicecheck=1|do.devicecheck=0|g' AnyKernel3/anykernel.sh
          grep -q "^BLOCK=" AnyKernel3/anykernel.sh && \
            sed -i 's|^BLOCK=.*|BLOCK=boot;|g' AnyKernel3/anykernel.sh || \
            echo 'BLOCK=boot;' >> AnyKernel3/anykernel.sh
          grep -q "IS_SLOT_DEVICE=" AnyKernel3/anykernel.sh && \
            sed -i 's|IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|g' AnyKernel3/anykernel.sh || \
            echo 'IS_SLOT_DEVICE=1;' >> AnyKernel3/anykernel.sh
          grep -q "device.name1=" AnyKernel3/anykernel.sh && \
            sed -i 's|device.name1=.*|device.name1=star|g' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../diphons-ksu-star-$(date +%Y%m%d-%H%M).zip . \
            -x ".git*" -x "*.md"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: diphons-ksu-star
          path: diphons-ksu-star-*.zip
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
