name: Base diphons KSU nativo + fixes Makefile + stubs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev \
            make libelf-dev python3 \
            zip curl wget cpio \
            clang-19 lld-19 llvm-19

      - name: Setup Clang 19 toolchain
        run: |
          LLVM_BIN=/usr/lib/llvm-19/bin
          mkdir -p clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x "$LLVM_BIN/$tool" ]; then
              ln -sf "$LLVM_BIN/$tool" clang/bin/$tool
            fi
          done
          clang/bin/clang --version

      - name: Setup GCC toolchain
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Apply QGKI 5.4 fixes (pgtable, nofault, etc.)
        run: |
          echo "=== FIX 1: pgtable.h ==="
          grep -rl "linux/pgtable.h" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 2: strncpy_from_user_nofault ==="
          grep -rl "strncpy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|strncpy_from_user_nofault|strncpy_from_user|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 3: copy_*_nofault ==="
          grep -rl "copy_to_kernel_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_kernel_nofault|probe_kernel_write|g' "$f"
          done
          grep -rl "copy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_from_user_nofault|probe_kernel_read|g' "$f"
          done
          grep -rl "copy_to_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_user_nofault|probe_kernel_write|g' "$f"
          done

          echo "=== FIX 4: pkg_observer.c fsnotify ==="
          python3 - << 'PYEOF'
          import re, os
          pkg = "drivers/kernelsu/manager/pkg_observer.c"
          if not os.path.exists(pkg):
              exit(0)
          with open(pkg, "r") as f:
              content = f.read()
          content = content.replace('.handle_inode_event =', '.handle_event =')
          old_fn = re.compile(
              r'static int (ksu_handle_inode_event|ksu_handle_event)\s*\('
              r'\s*struct fsnotify_mark\s*\*\s*\w+\s*,'
              r'\s*u32\s*\w+\s*,'
              r'\s*struct inode\s*\*\s*\w+\s*,'
              r'\s*struct inode\s*\*\s*\w+\s*,'
              r'\s*const struct qstr\s*\*\s*\w+\s*,'
              r'\s*u32\s*\w+\s*\)',
              re.DOTALL
          )
          new_fn = (
              'static int ksu_handle_event('
              'struct fsnotify_group *group, struct inode *inode, '
              'u32 mask, const void *data, int data_type, '
              'const struct qstr *file_name, u32 cookie, '
              'struct fsnotify_iter_info *iter_info)'
          )
          if old_fn.search(content):
              content = old_fn.sub(new_fn, content)
          else:
              content = re.sub(
                  r'static int ksu_handle_inode_event\b',
                  'static int ksu_handle_event', content
              )
          content = content.replace('ksu_handle_inode_event', 'ksu_handle_event')
          with open(pkg, "w") as f:
              f.write(content)
          print("  FIXED pkg_observer.c")
          PYEOF

          echo "=== FIX 5: sucompat.c function names ==="
          if [ -f drivers/kernelsu/feature/sucompat.c ]; then
            sed -i 's/execve_handler_pre/sys_execve_handler_pre/g' drivers/kernelsu/feature/sucompat.c
            sed -i 's/faccessat_handler_pre/sys_faccessat_handler_pre/g' drivers/kernelsu/feature/sucompat.c
            sed -i 's/newfstatat_handler_pre/sys_newfstatat_handler_pre/g' drivers/kernelsu/feature/sucompat.c
            sed -i 's/pts_unix98_lookup_kp/pts_unix98_lookup_pre/g' drivers/kernelsu/feature/sucompat.c
            echo "  FIXED sucompat.c"
          fi

          echo "✅ QGKI fixes aplicados"

      - name: Fix KSU subdirectory Makefiles (para compilar todo)
        run: |
          python3 - << 'PYEOF'
          import os

          ksu_root = "drivers/kernelsu"
          makefile_path = f"{ksu_root}/Makefile"

          if not os.path.exists(makefile_path):
              print("❌ No hay Makefile en drivers/kernelsu")
              exit(1)

          with open(makefile_path, "r") as f:
              content = f.read()

          print("=== Makefile actual ===")
          print(content)

          # Detectar subdirectorios con .c files
          subdirs = []
          for d in os.listdir(ksu_root):
              full = f"{ksu_root}/{d}"
              if os.path.isdir(full):
                  c_files = [f for f in os.listdir(full) if f.endswith(".c")]
                  if c_files:
                      subdirs.append(d)
                      print(f"  Subdir: {d} -> {c_files}")

          # Verificar que cada subdir esté en el Makefile o en su propio Makefile
          for sd in subdirs:
              subdir_mk = f"{ksu_root}/{sd}/Makefile"
              if not os.path.exists(subdir_mk):
                  # Crear Makefile para el subdir
                  c_files = [f for f in os.listdir(f"{ksu_root}/{sd}") if f.endswith(".c")]
                  lines = [f"obj-y += {f[:-2]}.o" for f in c_files]
                  with open(subdir_mk, "w") as f:
                      f.write("\n".join(lines) + "\n")
                  print(f"  ✅ Creado {subdir_mk}: {lines}")
              else:
                  print(f"  ✓ Ya existe {subdir_mk}")

              # Asegurar que el Makefile principal incluye el subdir
              obj_entry = f"obj-y += {sd}/"
              if obj_entry not in content:
                  content += f"\n{obj_entry}\n"
                  print(f"  ✅ Añadido al Makefile principal: {obj_entry}")

          with open(makefile_path, "w") as f:
              f.write(content)

          print("=== Makefile final ===")
          with open(makefile_path) as f:
              print(f.read())

          PYEOF

          # Fix app_profile.c (seccomp_filter_release)
          if [ -f drivers/kernelsu/policy/app_profile.c ]; then
            sed -i '/seccomp_filter_release/d' drivers/kernelsu/policy/app_profile.c
            sed -i '/atomic_set(&current->seccomp\.filter_count/d' drivers/kernelsu/policy/app_profile.c
            echo "  FIXED app_profile.c"
          fi

          echo "✅ KSU Makefile fixes aplicados"

      - name: Add global compatibility stubs (solo símbolos externos)
        run: |
          cat > drivers/kernelsu/compat_5_4.c << 'EOF'
          #include <linux/kernel.h>
          #include <linux/module.h>
          #include <linux/spinlock.h>
          #include <linux/list.h>
          #include <linux/fs.h>
          #include <linux/errno.h>
          #include <linux/types.h>
          #include <linux/export.h>

          // SusFS stubs (si no están en el kernel)
          DEFINE_SPINLOCK(mount_list_lock);
          LIST_HEAD(mount_list);
          EXPORT_SYMBOL(mount_list_lock);
          EXPORT_SYMBOL(mount_list);

          // is_first_ipcc_msg (Qualcomm)
          bool is_first_ipcc_msg(void) { return false; }
          EXPORT_SYMBOL(is_first_ipcc_msg);
          EOF

          # Forzar compilación como objeto independiente
          if ! grep -q "compat_5_4.o" drivers/kernelsu/Makefile; then
            echo 'obj-y += compat_5_4.o' >> drivers/kernelsu/Makefile
          fi
          echo "✅ Stubs globales añadidos"

      - name: Use functional config as defconfig (SIN Stack Protector forzado)
        run: |
          if [ ! -f configs/star_defconfig ]; then
            echo "❌ ERROR: configs/star_defconfig no encontrado"
            exit 1
          fi
          mkdir -p arch/arm64/configs
          cp configs/star_defconfig arch/arm64/configs/star_defconfig

          # Añadir configuraciones necesarias pero NO Stack Protector
          cat >> arch/arm64/configs/star_defconfig << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KPM=y
          CONFIG_QCOM_IPCC=y
          CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y
          CONFIG_BUILD_ARM64_DT_OVERLAY=y
          EOF

          echo "✅ star_defconfig copiado y configurado"

      - name: Pre-build diagnostics
        run: |
          echo "=== Verificar símbolos KSU en fuentes del kernel ==="
          for sym in mount_list mount_list_lock is_first_ipcc_msg; do
            echo "--- $sym ---"
            grep -r "EXPORT_SYMBOL.*$sym\b" --include="*.c" . 2>/dev/null | head -5 || echo "  NO EXPORTADO"
            grep -r "\b$sym\b" --include="*.h" . 2>/dev/null | head -3 || true
          done

          echo "=== KSU Makefiles finales ==="
          find drivers/kernelsu -name Makefile | xargs -I{} sh -c 'echo "=== {} ==="; cat {}'

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          make O=out ARCH=arm64 star_defconfig
          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "❌ No Image found"
            ls out/arch/arm64/boot/ || true
            exit 1
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          sed -i 's|do.devicecheck=1|do.devicecheck=0|g' AnyKernel3/anykernel.sh
          grep -q "^BLOCK=" AnyKernel3/anykernel.sh && \
            sed -i 's|^BLOCK=.*|BLOCK=boot;|g' AnyKernel3/anykernel.sh || \
            echo 'BLOCK=boot;' >> AnyKernel3/anykernel.sh
          grep -q "IS_SLOT_DEVICE=" AnyKernel3/anykernel.sh && \
            sed -i 's|IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|g' AnyKernel3/anykernel.sh || \
            echo 'IS_SLOT_DEVICE=1;' >> AnyKernel3/anykernel.sh
          grep -q "device.name1=" AnyKernel3/anykernel.sh && \
            sed -i 's|device.name1=.*|device.name1=star|g' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../diphons-final-v2-$(date +%Y%m%d-%H%M).zip . \
            -x ".git*" -x "*.md"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: diphons-final-v2
          path: diphons-final-v2-*.zip
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-final-v2
          path: build.log
