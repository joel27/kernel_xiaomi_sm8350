name: Base diphons KSU nativo (FINAL v6)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git bc bison flex libssl-dev \
            make libelf-dev python3 \
            zip curl wget cpio \
            clang-19 lld-19 llvm-19

      - name: Setup Clang 19 toolchain
        run: |
          LLVM_BIN=/usr/lib/llvm-19/bin
          mkdir -p clang/bin
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ -x "$LLVM_BIN/$tool" ]; then
              ln -sf "$LLVM_BIN/$tool" clang/bin/$tool
            fi
          done
          clang/bin/clang --version

      - name: Setup GCC toolchain
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            gcc32

      - name: Apply QGKI 5.4 fixes (pgtable, nofault, fsnotify)
        run: |
          echo "=== FIX 1: pgtable.h ==="
          grep -rl "linux/pgtable.h" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 2: strncpy_from_user_nofault ==="
          grep -rl "strncpy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|strncpy_from_user_nofault|strncpy_from_user|g' "$f"
            echo "  FIXED $f"
          done

          echo "=== FIX 3: copy_*_nofault ==="
          grep -rl "copy_to_kernel_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_kernel_nofault|probe_kernel_write|g' "$f"
          done
          grep -rl "copy_from_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_from_user_nofault|probe_kernel_read|g' "$f"
          done
          grep -rl "copy_to_user_nofault" drivers/kernelsu/ 2>/dev/null | while read f; do
            sed -i 's|copy_to_user_nofault|probe_kernel_write|g' "$f"
          done

          echo "=== FIX 4: pkg_observer.c fsnotify ==="
          python3 - << 'PYEOF'
          import re, os
          pkg = "drivers/kernelsu/manager/pkg_observer.c"
          if not os.path.exists(pkg):
              print("  SKIP: pkg_observer.c no existe")
              exit(0)
          with open(pkg, "r") as f:
              content = f.read()
          content = content.replace('.handle_inode_event =', '.handle_event =')
          old_fn = re.compile(
              r'static int (ksu_handle_inode_event|ksu_handle_event)\s*\('
              r'\s*struct fsnotify_mark\s*\*\s*\w+\s*,'
              r'\s*u32\s*\w+\s*,'
              r'\s*struct inode\s*\*\s*\w+\s*,'
              r'\s*struct inode\s*\*\s*\w+\s*,'
              r'\s*const struct qstr\s*\*\s*\w+\s*,'
              r'\s*u32\s*\w+\s*\)',
              re.DOTALL
          )
          new_fn = (
              'static int ksu_handle_event('
              'struct fsnotify_group *group, struct inode *inode, '
              'u32 mask, const void *data, int data_type, '
              'const struct qstr *file_name, u32 cookie, '
              'struct fsnotify_iter_info *iter_info)'
          )
          if old_fn.search(content):
              content = old_fn.sub(new_fn, content)
          else:
              content = re.sub(
                  r'static int ksu_handle_inode_event\b',
                  'static int ksu_handle_event', content
              )
          content = content.replace('ksu_handle_inode_event', 'ksu_handle_event')
          with open(pkg, "w") as f:
              f.write(content)
          print("  FIXED pkg_observer.c")
          PYEOF

          echo "✅ QGKI fixes aplicados"

      - name: Fix sucompat.c (handlers + insertar struct kprobe faltante)
        run: |
          # Escribir el script Python a /tmp para evitar problemas con
          # heredocs anidados dentro de loops en GitHub Actions
          cat > /tmp/fix_sucompat.py << 'PYEOF'
          import sys

          path = sys.argv[1]
          print("Procesando:", path)

          with open(path, "r") as fh:
              lines = fh.readlines()

          # Si ya existe la struct, no hacer nada
          if any("pts_unix98_lookup_kp" in l for l in lines):
              print("  SKIP: pts_unix98_lookup_kp ya declarado")
              sys.exit(0)

          # Buscar la linea donde empieza pts_unix98_lookup_pre
          start_line = -1
          for i, line in enumerate(lines):
              if "pts_unix98_lookup_pre" in line and "static int" in line:
                  start_line = i
                  print("  Handler encontrado en linea", i + 1, ":", line.rstrip())
                  break

          if start_line == -1:
              print("  ERROR: no se encontro pts_unix98_lookup_pre")
              sys.exit(1)

          # Contar llaves desde start_line para encontrar cierre de funcion
          depth = 0
          found_open = False
          close_line = -1
          for i in range(start_line, len(lines)):
              for ch in lines[i]:
                  if ch == '{':
                      depth += 1
                      found_open = True
                  elif ch == '}':
                      depth -= 1
              if found_open and depth == 0:
                  close_line = i
                  print("  Cierre de funcion en linea", i + 1, ":", lines[i].rstrip())
                  break

          if close_line == -1:
              print("  ERROR: no se encontro cierre de funcion")
              sys.exit(1)

          struct_decl = (
              "\n"
              "static struct kprobe pts_unix98_lookup_kp = {\n"
              '    .symbol_name = "pts_unix98_lookup",\n'
              "    .pre_handler = pts_unix98_lookup_pre,\n"
              "};\n"
          )

          lines.insert(close_line + 1, struct_decl)

          with open(path, "w") as fh:
              fh.writelines(lines)

          print("  INSERTED pts_unix98_lookup_kp despues de linea", close_line + 1)
          PYEOF

          # Aplicar fixes a cada sucompat.c encontrado
          find drivers/kernelsu -name "sucompat.c" -type f | while read f; do
            echo "=== Corrigiendo: $f ==="
            sed -i 's/\bexecve_handler_pre\b/sys_execve_handler_pre/g'       "$f"
            sed -i 's/\bfaccessat_handler_pre\b/sys_faccessat_handler_pre/g'  "$f"
            sed -i 's/\bnewfstatat_handler_pre\b/sys_newfstatat_handler_pre/g' "$f"
            python3 /tmp/fix_sucompat.py "$f"
          done

          echo ""
          echo "=== Verificar resultado ==="
          find drivers/kernelsu -name "sucompat.c" | xargs grep -n "pts_unix98_lookup" 2>/dev/null
          echo "✅ sucompat.c corregido"

      - name: Fix app_profile.c (seccomp 5.4 incompatibility)
        run: |
          if [ -f drivers/kernelsu/policy/app_profile.c ]; then
            sed -i '/seccomp_filter_release/d' \
              drivers/kernelsu/policy/app_profile.c
            sed -i '/atomic_set(&current->seccomp\.filter_count/d' \
              drivers/kernelsu/policy/app_profile.c
            echo "  FIXED app_profile.c"
          fi

      - name: Fix su_mount_ns.c (path_mount no existe en kernel 5.4)
        run: |
          if [ -f drivers/kernelsu/infra/su_mount_ns.c ]; then
            sed -i 's/\bpath_mount\b/do_mount/g' \
              drivers/kernelsu/infra/su_mount_ns.c
            echo "  FIXED su_mount_ns.c"
          fi

      - name: Fix KSU subdirectory Makefiles
        run: |
          python3 - << 'PYEOF'
          import os

          ksu_root = "drivers/kernelsu"
          makefile_path = f"{ksu_root}/Makefile"

          if not os.path.exists(makefile_path):
              print("ERROR: No hay Makefile en drivers/kernelsu")
              exit(1)

          with open(makefile_path, "r") as f:
              content = f.read()

          print("=== Makefile actual ===")
          print(content)

          subdirs = []
          for d in sorted(os.listdir(ksu_root)):
              full = f"{ksu_root}/{d}"
              if os.path.isdir(full):
                  c_files = sorted([fn for fn in os.listdir(full) if fn.endswith(".c")])
                  if c_files:
                      subdirs.append((d, c_files))
                      print(f"  Subdir: {d} -> {c_files}")

          for sd, c_files in subdirs:
              subdir_mk = f"{ksu_root}/{sd}/Makefile"
              if not os.path.exists(subdir_mk):
                  obj_lines = [f"obj-y += {fn[:-2]}.o" for fn in c_files]
                  with open(subdir_mk, "w") as f:
                      f.write("\n".join(obj_lines) + "\n")
                  print(f"  Creado {subdir_mk}")
              else:
                  print(f"  Ya existe {subdir_mk}")

              obj_entry = f"obj-y += {sd}/"
              if obj_entry not in content:
                  content += f"\n{obj_entry}\n"
                  print(f"  Añadido al Makefile principal: {obj_entry}")

          with open(makefile_path, "w") as f:
              f.write(content)

          print("\n=== Makefile final ===")
          with open(makefile_path) as f:
              print(f.read())
          PYEOF
          echo "✅ KSU Makefiles corregidos"

      - name: Add compatibility stubs for missing kernel 5.4 symbols
        run: |
          python3 - << 'PYEOF'
          import subprocess

          r1 = subprocess.run(
              ["grep", "-r", "EXPORT_SYMBOL.*mount_list", "--include=*.c", "fs/", "kernel/"],
              capture_output=True, text=True
          )
          mount_list_exported = bool(r1.stdout.strip())
          print(f"mount_list exportado en kernel: {mount_list_exported}")

          r2 = subprocess.run(
              ["grep", "-r", "is_first_ipcc_msg", "--include=*.c", "drivers/"],
              capture_output=True, text=True
          )
          ipcc_in_kernel = bool(r2.stdout.strip())
          print(f"is_first_ipcc_msg en drivers/: {ipcc_in_kernel}")

          stub_lines = [
              '#include <linux/kernel.h>',
              '#include <linux/spinlock.h>',
              '#include <linux/list.h>',
              '#include <linux/errno.h>',
              '#include <linux/types.h>',
              '#include <linux/export.h>',
              '',
          ]

          if not mount_list_exported:
              print("  -> Añadiendo stubs de mount_list / mount_list_lock")
              stub_lines += [
                  '/* mount_list: no exportado en este kernel base */',
                  'DEFINE_SPINLOCK(mount_list_lock);',
                  'LIST_HEAD(mount_list);',
                  'EXPORT_SYMBOL(mount_list_lock);',
                  'EXPORT_SYMBOL(mount_list);',
                  '',
              ]

          if not ipcc_in_kernel:
              print("  -> Añadiendo stub de is_first_ipcc_msg")
              stub_lines += [
                  '/* is_first_ipcc_msg: driver QCOM IPCC no disponible */',
                  'bool is_first_ipcc_msg(void) { return false; }',
                  'EXPORT_SYMBOL(is_first_ipcc_msg);',
                  '',
              ]

          stub_lines += [
              '/* ksu_install_fd: weak stub de seguridad */',
              'int __attribute__((weak)) ksu_install_fd(void) { return 0; }',
              'EXPORT_SYMBOL(ksu_install_fd);',
          ]

          with open("drivers/kernelsu/compat_5_4.c", "w") as f:
              f.write("\n".join(stub_lines) + "\n")

          print("✅ compat_5_4.c generado")
          PYEOF

          if ! grep -q "compat_5_4.o" drivers/kernelsu/Makefile; then
            echo 'obj-y += compat_5_4.o' >> drivers/kernelsu/Makefile
            echo "  ✅ compat_5_4.o añadido al Makefile"
          fi

      - name: Use functional config as defconfig
        run: |
          if [ ! -f configs/star_defconfig ]; then
            echo "ERROR: configs/star_defconfig no encontrado"
            exit 1
          fi
          mkdir -p arch/arm64/configs
          cp configs/star_defconfig arch/arm64/configs/star_defconfig

          sed -i 's/^CONFIG_STACKPROTECTOR_STRONG=y/# CONFIG_STACKPROTECTOR_STRONG is not set/' \
            arch/arm64/configs/star_defconfig
          sed -i 's/^CONFIG_STACKPROTECTOR=y/# CONFIG_STACKPROTECTOR is not set/' \
            arch/arm64/configs/star_defconfig
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' \
            arch/arm64/configs/star_defconfig
          sed -i 's/^CONFIG_KSU_SUSFS_SUS_MOUNT=y/# CONFIG_KSU_SUSFS_SUS_MOUNT is not set/' \
            arch/arm64/configs/star_defconfig
          sed -i 's/^CONFIG_KSU_SUSFS_TRY_UMOUNT=y/# CONFIG_KSU_SUSFS_TRY_UMOUNT is not set/' \
            arch/arm64/configs/star_defconfig
          sed -i 's/^CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y/# CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT is not set/' \
            arch/arm64/configs/star_defconfig

          cat >> arch/arm64/configs/star_defconfig << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          CONFIG_KPM=y
          CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y
          CONFIG_BUILD_ARM64_DT_OVERLAY=y
          EOF

          echo "✅ star_defconfig configurado"

      - name: Pre-build diagnostics
        run: |
          echo "=== Archivos .c en KSU ==="
          find drivers/kernelsu -name "*.c" | sort

          echo ""
          echo "=== Verificar pts_unix98_lookup en sucompat.c ==="
          find drivers/kernelsu -name "sucompat.c" | xargs grep -n "pts_unix98_lookup" 2>/dev/null \
            || echo "  sucompat.c no encontrado"

          echo ""
          echo "=== KSU Makefiles ==="
          find drivers/kernelsu -name "Makefile" | sort | while read mk; do
            echo "--- $mk ---"
            cat "$mk"
          done

          echo ""
          echo "=== Verificar símbolos críticos ==="
          for sym in \
              apply_kernelsu_rules \
              ksu_selinux_hide_init ksu_selinux_hide_exit \
              ksu_selinux_hide_drop_backup_if_unused \
              ksu_supercalls_init ksu_supercalls_exit \
              ksu_install_fd \
              ksu_handle_devpts ksu_handle_execveat ksu_handle_vfs_read \
              pts_unix98_lookup_kp \
              mount_list mount_list_lock \
              is_first_ipcc_msg; do
            files=$(grep -rl "\b${sym}\b" drivers/kernelsu/ --include="*.c" 2>/dev/null | tr '\n' ' ')
            if [ -n "$files" ]; then
              echo "  OK $sym -> $files"
            else
              echo "  WARN $sym -> NO encontrado"
            fi
          done

          echo ""
          echo "=== compat_5_4.c ==="
          cat drivers/kernelsu/compat_5_4.c

      - name: Build kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc64/bin:$GITHUB_WORKSPACE/gcc32/bin:$PATH"

          make O=out ARCH=arm64 star_defconfig
          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/
          else
            echo "No Image found"
            ls out/arch/arm64/boot/ || true
            exit 1
          fi

          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          fi

          sed -i 's|do.devicecheck=1|do.devicecheck=0|g' AnyKernel3/anykernel.sh

          grep -q "^BLOCK=" AnyKernel3/anykernel.sh \
            && sed -i 's|^BLOCK=.*|BLOCK=boot;|g' AnyKernel3/anykernel.sh \
            || echo 'BLOCK=boot;' >> AnyKernel3/anykernel.sh

          grep -q "IS_SLOT_DEVICE=" AnyKernel3/anykernel.sh \
            && sed -i 's|IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=1;|g' AnyKernel3/anykernel.sh \
            || echo 'IS_SLOT_DEVICE=1;' >> AnyKernel3/anykernel.sh

          grep -q "device.name1=" AnyKernel3/anykernel.sh \
            && sed -i 's|device.name1=.*|device.name1=star|g' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 ../diphons-ksu-$(date +%Y%m%d-%H%M).zip . \
            -x ".git*" -x "*.md"

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: diphons-ksu
          path: diphons-ksu-*.zip
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          
